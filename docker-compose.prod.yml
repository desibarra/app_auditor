version: '3.8'

services:
  # Backend NestJS
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sentinel-backend-prod
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_PATH=/app/data/saas_fiscal.db
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      # Persistir base de datos SQLite
      - backend_data:/app/data
      # Logs
      - ./logs/backend:/app/logs
    networks:
      - sentinel_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React/Vite con Nginx
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: sentinel-frontend-prod
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sentinel_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis-prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sentinel_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_data:
    driver: local
  redis_data:
    driver: local

networks:
  sentinel_network:
    driver: bridge
